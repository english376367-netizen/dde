function render(list, containerId, part){
 const box=document.getElementById(containerId);
 list.forEach((q,i)=>{
   const card=document.createElement("div");
   card.className="question";
   card.dataset.part=part;
   card.innerHTML=`<div class="qnum">Question ${part===1?i+1:i+16}</div>
   <div class="english">${q[0]}</div>
   <div class="options"></div>
   <div class="feedback"></div>`;
   const opts=card.querySelector(".options");
   q[1].forEach((txt,idx)=>{
     const b=document.createElement("div");
     b.className="option";
     b.textContent=txt;
     b.dataset.answer=String.fromCharCode(65+idx);
     b.onclick=()=>check(card,q,part,b.dataset.answer);
     opts.appendChild(b);
   });
   box.appendChild(card);
 });
}
function check(card,q,part,chosen){
 if(card.dataset.done) return;
 card.dataset.done="1";
 const correct=q[2];
 const buttons=card.querySelectorAll(".option");
 buttons.forEach(b=>{
   b.classList.add("disabled");
   if(b.dataset.answer===correct) b.classList.add("correct");
   if(b.dataset.answer===chosen && chosen!==correct) b.classList.add("wrong");
 });
 const fb=card.querySelector(".feedback");
 if(chosen===correct){
   fb.className="feedback show good";
   fb.innerHTML="<strong>✓ Correct!</strong><div class='translation'>"+q[3]+"</div>";
   card.dataset.correct="1";
 }else{
   fb.className="feedback show bad";
   fb.innerHTML="<strong>✗ Incorrect.</strong> The correct answer is <b>"+correct+"</b>.<div class='translation'>"+q[3]+"</div>";
 }
 updateScores();
}
function updateScores(){
 let s1=document.querySelectorAll('#part1 .question[data-correct="1"]').length;
 let s2=document.querySelectorAll('#part2 .question[data-correct="1"]').length;
 document.getElementById("score1").textContent=s1+" / 15";
 document.getElementById("score2").textContent=s2+" / 13";
}
function resetAll(){location.reload()}
document.getElementById("reset").onclick=resetAll;
render(questions1,"part1",1);
render(questions2,"part2",2);
